docker:
  - image: cimg/node:24.14.1
resource_class: medium
shell: /bin/bash -eo pipefail
steps:
  - checkout
  - check_circleci_config
  - install_flutter
  - run:
      name: Check Formatting
      command: fvm dart format -l 120 -o none --set-exit-if-changed .
  # Prepare project after formatting check to avoid errors due to autogenerated files
  - prepare_project
  - run:
      name: Check Analyzer and Linting
      command: fvm flutter analyze --fatal-infos --fatal-warnings
  - run:
      name: Check Unused Translations
      command: |
        mkdir -p /tmp/slang-analysis
        fvm dart run slang analyze --full --outdir=/tmp/slang-analysis
        node -e '
          const { "@@info": _, ...locales } = require("/tmp/slang-analysis/_unused_translations.json")
          const unused = Object.entries(locales).filter(([, keys]) => Object.keys(keys).length > 0)
          if (unused.length > 0) {
            console.error("Unused translations found:\n" + JSON.stringify(Object.fromEntries(unused), null, 2))
            process.exit(1)
          }
        '
